name: 上游更新检测

# 只读检测：上游 cheat2001/angkorgit 有新提交时，创建一个 Issue 并 @ 仓库所有者。
# 还会「试跑」一次合并 + 自动汉化（不推送），把待译数量与混排风险写进 Issue。
# 不写 main、不构建、不发布。后续动作：运行「同步并汉化（PR）」，人工校对后合并。

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 01:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游无新提交也生成报告（用于验证流程）'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "angkorgit-zh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 检测上游更新
        id: check
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cheat2001/angkorgit.git
          git fetch upstream main --tags --force
          force='${{ inputs.force }}'
          if git merge-base --is-ancestor upstream/main HEAD && [ "$force" != "true" ]; then
            echo "上游无新提交，跳过。"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_update=true" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse --short upstream/main)
          echo "$sha" > "$RUNNER_TEMP/sha.txt"
          git log --oneline HEAD..upstream/main > "$RUNNER_TEMP/upstream.txt"
          base=$(git merge-base HEAD upstream/main)
          git diff --stat "$base" upstream/main > "$RUNNER_TEMP/stat.txt"

      - name: 试跑合并与自动汉化（不推送，仅用于评估）
        if: steps.check.outputs.has_update == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          git merge upstream/main -X theirs --no-edit
          Copy-Item docs/README.zh.md README.md -Force
          $pub = (Get-Content -Raw zh-dict/updater-pubkey.txt).Trim()
          $conf = 'apps/desktop/src-tauri/tauri.conf.json'
          $raw = Get-Content -Raw $conf
          $raw = [regex]::Replace($raw, '"pubkey": "[^"]*"', ('"pubkey": "' + $pub + '"'))
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $conf), $raw, (New-Object System.Text.UTF8Encoding($false)))
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "chore: 合并上游并恢复自维护文件" --no-verify }
          pwsh -NoProfile -File scripts/sync-localize.ps1 -Repo "$env:GITHUB_WORKSPACE" -SkipSync *>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'localize.txt')

      - name: 试跑混排文案检查
        if: steps.check.outputs.has_update == 'true'
        continue-on-error: true
        run: node scripts/check-copy.mjs > "$RUNNER_TEMP/copycheck.txt" 2>&1

      - name: 生成 Issue 正文
        if: steps.check.outputs.has_update == 'true'
        run: |
          sha=$(cat "$RUNNER_TEMP/sha.txt")
          pending=0
          if [ -f zh-dict/pending.tsv ]; then pending=$(grep -vc '^#' zh-dict/pending.tsv || true); fi
          {
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "> 本次为**手动强制生成**（上游无新提交时用于验证流程）。"
              echo
            fi
            echo "@$GITHUB_REPOSITORY_OWNER 上游有新的提交，请人工分析后运行 **同步并汉化（PR）**。"
            echo
            echo "上游 main：\`$sha\`"
            echo
            echo "### 上游提交"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/upstream.txt"
            echo '```'
            echo
            echo "### 变更统计"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/stat.txt"
            echo '```'
            echo
            echo "### 自动汉化试跑"
            echo
            echo "- 待译/待确认英文串：**$pending** 条（完整清单见「同步并汉化（PR）」的 pending-strings 构件）"
            echo
            echo "混排文案检查（自动汉化是否会切坏文案；非空即为需要人工处理的位置）："
            echo
            echo '```text'
            cat "$RUNNER_TEMP/copycheck.txt" 2>/dev/null || echo "（试跑未完成）"
            echo '```'
            echo
            echo "<details><summary>自动汉化日志（末尾 15 行）</summary>"
            echo
            echo '```text'
            tail -15 "$RUNNER_TEMP/localize.txt" 2>/dev/null || echo "（试跑未完成）"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "### 下一步"
            echo
            echo "1. 运行 **同步并汉化（PR）** 得到 PR。"
            echo "2. 按 pending-strings 构件补 \`zh-dict/dict.tsv\`。"
            echo "3. CI 全绿后合并；发版用 **发布中文版**。"
          } > "$RUNNER_TEMP/body.md"

      - name: 创建 Issue（同一上游提交只创建一次）
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cat "$RUNNER_TEMP/sha.txt")
          gh label create upstream-sync -R "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "上游同步追踪" 2>/dev/null || true
          latest=$(gh issue list --label upstream-sync --state all --limit 1 \
            --json title --jq '.[0].title' -R "$GITHUB_REPOSITORY")
          if printf '%s' "$latest" | grep -q "$sha"; then
            echo "上游提交 $sha 已有对应 Issue，跳过。"
            exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "上游更新：$sha" \
            --label upstream-sync \
            --body-file "$RUNNER_TEMP/body.md"

      - name: 邮件通知（可选：配置 SMTP_SERVER 等 secrets 后启用）
        if: steps.check.outputs.has_update == 'true' && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ vars.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "AngKorGit 中文版：上游有新的提交"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            上游 main 有新的提交，请查看仓库 Issue 并运行「同步并汉化（PR）」。
            https://github.com/${{ github.repository }}/issues
